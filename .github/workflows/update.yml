name: Update from wiki & deploy

on:
  schedule:
    # Times are UTC. Reveal is 9:30pm PT Wednesday = 04:30 UTC Thursday (05:30 in winter).
    - cron: '*/15 4-8 * * 4'  # Wed night: every 15 min, 04:00-08:45 UTC (9pm-1:45am PDT / 8pm-12:45am PST)
    - cron: '0 10-18/2 * * 4' # Thursday backups every 2 hours
    - cron: '30 11 * * *'     # daily catch-all
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest season data from the wiki
        run: node scripts/update.mjs

      - name: Commit data changes
        run: |
          git config user.name "survivor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update season data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
