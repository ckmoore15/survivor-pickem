name: Update from wiki & deploy

on:
  schedule:
    - cron: '30 11 * * *'   # daily, 7:30am EDT / 6:30am EST (after the West Coast has watched)
    - cron: '0 17 * * 4'    # Thursday retry in case the wiki was slow
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest season data from the wiki
        run: node scripts/update.mjs

      - name: Commit data changes
        run: |
          git config user.name "survivor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update season data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
