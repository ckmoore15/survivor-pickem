name: Update from wiki & deploy

on:
  schedule:
    # Times are UTC. Reveal is 9:30pm ET Wednesday = 01:30 UTC Thursday (02:30 in winter).
    # GitHub often runs scheduled jobs late or skips them, so instead of polling with
    # many short runs, these Wednesday-evening runs start early and *wait*, checking the
    # wiki every 3 minutes until results are up. Extras are backups if one gets skipped.
    - cron: '7 0-3 * * 4'     # Wed evening starters (7-10pm EST / 8-11pm EDT)
    - cron: '37 0-3 * * 4'
    - cron: '23 10-18/2 * * 4' # Thursday backups
    - cron: '30 11 * * *'     # daily catch-all
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest season data from the wiki
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Wednesday-evening starters wait up to 5 hours for the wiki to post results.
          case "$SCHEDULE" in
            *"0-3 * * 4") node scripts/update.mjs --wait=300 ;;
            *) node scripts/update.mjs ;;
          esac

      - name: Commit data changes
        run: |
          git config user.name "survivor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update season data"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
